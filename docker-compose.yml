version: '3.8'

services:
  clash-nexus:
    build: .
    container_name: clash-nexus
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-this-admin-token}
      - SUBSCRIBE_TOKEN=${SUBSCRIBE_TOKEN:-change-this-subscribe-token}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
